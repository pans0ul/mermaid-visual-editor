name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  # ---------------------------------------------------------------
  # prepare: bump version & push tag (dispatch), or read tag version
  # The actual builds run on the tag-push event so every platform job
  # sees the final committed version.
  # ---------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm install --frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json pnpm-lock.yaml
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master
          git push origin "v${VERSION}"
          echo "Tag v${VERSION} pushed — build triggered by tag event."

      - name: Read version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # build: one job per platform
  # ---------------------------------------------------------------
  build:
    needs: prepare
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: win,   script: 'pnpm desktop:dist' }
          - { os: ubuntu-latest, platform: linux, script: 'pnpm desktop:dist:linux' }
          - { os: macos-latest,  platform: mac,   script: 'pnpm desktop:dist:mac' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Install wine (Windows cross-build only)
        if: matrix.platform == 'win'
        run: |
          set -x
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine
          sudo apt-get install -y --no-install-recommends wine32:i386
          wine --version
        timeout-minutes: 15

      - run: pnpm build
      - name: Verify out/ exists
        run: '[ -d "out" ] || (echo "ERROR: out/ not created"; exit 1)'

      - name: Build desktop artifacts (${{ matrix.platform }})
        run: |
          ${{ matrix.script }} 2>&1 | tee desktop-build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::${{ matrix.platform }} desktop build failed (exit $status). Last 40 lines:"
            tail -40 desktop-build.log | sed 's/^/::error::/'
            exit $status
          fi
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-cache
        timeout-minutes: 30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # release: publish to npm (optional) + create GitHub Release with
  # every platform's artifacts
  # ---------------------------------------------------------------
  release:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## 服务器模式 (Server mode)
            ```bash
            npx mermaid-visual-editor
            ```

            ## 桌面版 (Desktop)

            | 平台 | 安装包 |
            |------|--------|
            | Windows | `Mermaid-Visual-Editor-Setup-*.exe` 安装版 / `*-Portable-*.exe` 免安装 |
            | macOS | `Mermaid-Visual-Editor-*-mac-*.dmg`(Apple Silicon 用 arm64 版) |
            | Linux | `Mermaid-Visual-Editor-*-linux-x86_64.AppImage`(chmod +x 后直接运行)/ `.deb` |
