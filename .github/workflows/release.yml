name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: pnpm/action-setup@v4
        with: { version: '10.33' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm install --frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json pnpm-lock.yaml
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master
          git push origin "v${VERSION}"
          echo "Tag v${VERSION} pushed - build triggered by tag event."

      - name: Read version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-web:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out/
          if-no-files-found: error

  desktop:
    needs: [prepare, build-web]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux, script: 'pnpm desktop:dist:linux' }
          - { os: macos-latest,   target: mac,   script: 'pnpm desktop:dist:mac' }
          - { os: windows-latest, target: win,   script: 'pnpm desktop:dist' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: out

      - name: Linux deps (deb/rpm/AppImage)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop (${{ matrix.target }})
        run: ${{ matrix.script }}
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-cache
        timeout-minutes: 30

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: release/*
          if-no-files-found: warn

  release:
    needs: [prepare, build-web, desktop]
    if: github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
          body: |
            ## 服务器模式 (Server mode)
            ```bash
            npx mermaid-visual-editor
            ```

            ## 桌面版 (Desktop)

            | 平台 | 安装包 |
            |------|--------|
            | Windows | `Mermaid-Visual-Editor-Setup-*.exe` 安装版 / `*-Portable-*.exe` 免安装 |
            | macOS | `Mermaid-Visual-Editor-*-mac-*.dmg`(Apple Silicon 用 arm64 版) |
            | Linux | `Mermaid-Visual-Editor-*-linux-x86_64.AppImage`(chmod +x 后直接运行)/ `.deb` |
