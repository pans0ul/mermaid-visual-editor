name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify out/ exists
        run: '[ -d "out" ] || (echo "ERROR: out/ not created"; exit 1)'

      # dispatch path: bump version, commit, tag, push
      - name: Bump version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master
          git push origin "v${VERSION}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

      # tag-push path: extract version from tag
      - name: Set version from tag
        if: github.event_name == 'push'
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Windows desktop artifacts (electron-builder + wine)
      - name: Install wine (for Windows cross-build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine
          # wine32 needed by electron-builder for NSIS/portable targets
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine32:i386 || true
        timeout-minutes: 15
      - name: Build Windows desktop artifacts
        run: pnpm desktop:dist
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-cache
        timeout-minutes: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
          body: |
            ## 服务器模式 (Server mode)
            ```bash
            npx mermaid-visual-editor
            ```

            ## Windows 桌面版 (Desktop)
            下载下方 `Mermaid-Visual-Editor-Setup-*.exe` 安装,或 `*-Portable-*.exe` 免安装运行。
