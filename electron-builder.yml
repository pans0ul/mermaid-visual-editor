# electron-builder configuration — Windows / Linux / macOS desktop distribution
# Artifacts land in release/ (gitignored).
appId: com.pans0ul.mermaid-visual-editor
productName: Mermaid Visual Editor
copyright: Copyright © 2026 pans0ul

directories:
  output: release
  buildResources: electron-assets

files:
  - out/**/*
  - electron/**/*
  - electron-assets/icon.png
  - package.json
  - '!node_modules/**/*'

asar: true
compression: normal
npmRebuild: false

# ----------------------------- Windows -----------------------------
win:
  target:
    - nsis
    - portable
    - zip
  icon: electron-assets/icon.png
  artifactName: Mermaid-Visual-Editor-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mermaid Visual Editor
  deleteAppDataOnUninstall: false
  artifactName: Mermaid-Visual-Editor-Setup-${version}.${ext}

portable:
  artifactName: Mermaid-Visual-Editor-Portable-${version}.${ext}

# ------------------------------ macOS ------------------------------
mac:
  target:
    - dmg
    - zip
  icon: electron-assets/icon.png
  category: public.app-category.developer-tools
  artifactName: Mermaid-Visual-Editor-${version}-mac-${arch}.${ext}
  # No signing identity on CI — build unsigned (ad-hoc) artifacts.
  identity: null

dmg:
  artifactName: Mermaid-Visual-Editor-${version}-mac-${arch}.${ext}

# ------------------------------ Linux ------------------------------
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  icon: electron-assets/icon.png
  category: Development
  maintainer: pans0ul <pans0ul@163.com>
  synopsis: Visual drag-and-drop editor for Mermaid.js diagrams
  artifactName: Mermaid-Visual-Editor-${version}-linux-${arch}.${ext}

appImage:
  artifactName: Mermaid-Visual-Editor-${version}-linux-${arch}.${ext}

deb:
  artifactName: Mermaid-Visual-Editor-${version}-linux-${arch}.${ext}
